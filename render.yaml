services:
  - type: web
    name: TripLog
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: triplog
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
