services:
  - type: web
    name: TripLog
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: triplog-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB
        value: triplog
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: APP_URL
        value: https://triplog.my
      - key: KAKAO_REDIRECT_URI
        value: https://triplog.my/api/auth/kakao/callback
      - key: GOOGLE_REDIRECT_URI
        value: https://triplog.my/api/auth/google/callback
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
